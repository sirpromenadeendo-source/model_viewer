<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D モデルビューアー</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                 "Noto Sans JP", Meiryo, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Loading / error overlay */
  #overlay { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 14px;
    background: #14161c; color: #e8eaf0; z-index: 30; transition: opacity .4s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 42px; height: 42px; border: 4px solid #2c3040;
    border-top-color: #06d6a0; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlay .msg { font-size: 14px; opacity: .85; max-width: 80%; text-align: center;
    line-height: 1.6; }
  #overlay.error .spinner { display: none; }
  #overlay.error .msg { color: #ffb3c1; }

  /* Control panel */
  #panel { position: fixed; top: 14px; right: 14px; z-index: 20;
    width: 230px; background: rgba(22,24,32,.82); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
    padding: 14px 16px; color: #e8eaf0; font-size: 13px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35); user-select: none; }
  #panel h1 { font-size: 13px; font-weight: 700; letter-spacing: .02em;
    margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
  #panel h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #06d6a0; }
  .row { margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .row label { display: block; margin-bottom: 6px; opacity: .8; font-size: 12px; }
  .row .val { float: right; opacity: .55; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #06d6a0; cursor: pointer; }
  .swatches { display: flex; gap: 7px; align-items: center; }
  .sw { width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; transition: transform .1s; }
  .sw:hover { transform: scale(1.12); }
  .sw.active { border-color: #06d6a0; }
  input[type=color] { width: 24px; height: 24px; padding: 0; border: none;
    border-radius: 6px; background: none; cursor: pointer; }
  .btn { width: 100%; padding: 8px; border-radius: 9px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05); color: #e8eaf0; cursor: pointer; font-size: 12px;
    transition: background .15s; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .toggle { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3a3f52; border-radius: 22px;
    transition: .2s; cursor: pointer; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px;
    top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #06d6a0; }
  .switch input:checked + .slider::before { transform: translateX(18px); }

  #hint { position: fixed; bottom: 12px; left: 14px; z-index: 20; color: #c9cede;
    font-size: 11.5px; opacity: .6; background: rgba(22,24,32,.6);
    padding: 6px 10px; border-radius: 8px; }

  /* Scale bar (bottom-right) */
  #scalebar { position: fixed; bottom: 16px; right: 16px; z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #e8eaf0; font-size: 11.5px; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  #scalebar.hidden { display: none; }
  #scalebar .bar { height: 8px; border: 2px solid currentColor; border-top: none;
    box-sizing: border-box; transition: width .08s linear; }
  #scalebar .lbl { line-height: 1; }
  #scalebar .lbl b { font-weight: 700; }
  #scalebar .lbl span { opacity: .7; margin-left: 3px; }
  @media (max-width: 560px) {
    #panel { width: calc(100% - 28px); top: auto; bottom: 14px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="overlay"><div class="spinner"></div><div class="msg">モデルを読み込み中...</div></div>

<div id="panel">
  <h1><span class="dot"></span>ビューアー設定</h1>

  <div class="row">
    <label>背景色</label>
    <div class="swatches" id="bgSwatches">
      <span class="sw" data-c="#14161c" style="background:#14161c"></span>
      <span class="sw" data-c="#ffffff" style="background:#ffffff"></span>
      <span class="sw" data-c="#6b7280" style="background:#6b7280"></span>
      <span class="sw" data-c="#0b3d5c" style="background:#0b3d5c"></span>
      <input type="color" id="bgColor" value="#14161c" title="カスタム色" />
    </div>
  </div>

  <div class="row">
    <label>ライトの明るさ <span class="val" id="dirVal">1.2</span></label>
    <input type="range" id="dirLight" min="0" max="3" step="0.05" value="1.2" />
  </div>

  <div class="row">
    <label>環境光 <span class="val" id="ambVal">0.8</span></label>
    <input type="range" id="ambLight" min="0" max="3" step="0.05" value="0.8" />
  </div>

  <div class="row toggle">
    <label style="margin:0">スケール表示</label>
    <label class="switch"><input type="checkbox" id="scaleToggle" checked /><span class="slider"></span></label>
  </div>

  <div class="row">
    <button class="btn" id="resetBtn">視点をリセット</button>
  </div>
</div>

<div id="hint">ドラッグ：回転　｜　ホイール：ズーム　｜　右ドラッグ：移動</div>

<div id="scalebar">
  <div class="lbl"><b id="scaleNum">–</b><span id="scaleUnit">mm</span></div>
  <div class="bar" id="scaleBarLine" style="width:120px"></div>
</div>

<!-- ============================================================= -->
<!-- 表示するモデルの指定：ここのファイル名だけ変えれば差し替えできます -->
<!-- ============================================================= -->
<script>
  window.MODEL_CONFIG = {
    // ▼ 自動検出：GitHub Pages では下の modelDir フォルダ内のモデルを自動で探して
    //   表示します。ファイル名の変更や obj/mtl の書き換えは不要です。
    //   対応形式：.glb / .gltf / .obj（.glb を優先。大きい .obj は .glb 変換推奨）
    //   （.obj のときは同名の .mtl があれば一緒に読み込みます）
    autoDetect: true,
    modelDir: "model",

    // ▼ 自動検出できない環境（ローカル表示など）や autoDetect: false のときに使うパス
    obj: "model/sample.obj",   // ← .obj / .glb / .gltf のパスに変更
    mtl: "model/sample.mtl",   // ← .obj 用。.mtl が無い / glb の場合は "" でOK
    // テクスチャは .mtl 内の map_Kd で参照されます（PNG / JPG どちらでもOK）。
    // .glb はテクスチャを内包するので mtl は不要です。

    // 任意：.mtl を使わずテクスチャ画像を直接貼りたいとき、ここにパスを書きます
    // （jpg / png / webp などブラウザが表示できる形式ならOK）。
    // 指定した場合は .mtl のテクスチャより優先されます。使わないなら "" のまま。
    texture: "",

    // スケール表示の設定：モデル座標 1 が実寸で何 mm かを指定します。
    // 例）モデルを mm 単位で作ってあるなら 1、cm 単位なら 10、m 単位なら 1000。
    unitToMm: 1,
    // スケールバーが表示する最大値（mm）。10cm = 100mm。
    maxScaleMm: 100,
  };
</script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/OrbitControls.js";
import { OBJLoader } from "three/addons/OBJLoader.js";
import { MTLLoader } from "three/addons/MTLLoader.js";
import { GLTFLoader } from "three/addons/GLTFLoader.js";
import { DRACOLoader } from "three/addons/DRACOLoader.js";

const cfg = window.MODEL_CONFIG;
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

// --- Scene & camera ---
const scene = new THREE.Scene();
let bg = new THREE.Color("#14161c");
scene.background = bg;

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 5000);
camera.position.set(3, 2, 4);

// --- Lights ---
const ambient = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(5, 8, 6);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
dir2.position.set(-6, -2, -4);
scene.add(dir2);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;

let homeTarget = new THREE.Vector3();
let homePos = camera.position.clone();

// --- Fit camera to object ---
function frameObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;

  // center the model at origin
  obj.position.sub(center);

  const fov = camera.fov * (Math.PI / 180);
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 1.6;

  camera.position.set(dist * 0.6, dist * 0.4, dist);
  camera.near = maxDim / 1000;
  camera.far = maxDim * 1000;
  camera.updateProjectionMatrix();

  controls.target.set(0, 0, 0);
  controls.update();

  homeTarget = controls.target.clone();
  homePos = camera.position.clone();
}

// --- Load model ---
function showError(msg) {
  overlay.classList.add("error");
  overlay.querySelector(".msg").innerHTML = msg;
}

function applyTextureOverride(root, url) {
  const tl = new THREE.TextureLoader(manager);
  tl.load(url, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace; // 色を正しく表示
    root.traverse((c) => {
      if (!c.isMesh) return;
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach((m) => {
        if (!m) return;
        m.map = tex;
        if (m.color) m.color.set(0xffffff); // テクスチャ色をそのまま出す
        m.needsUpdate = true;
      });
    });
  }, undefined, () => {
    console.warn("テクスチャ画像を読み込めませんでした: " + url);
  });
}

function addObject(object) {
  scene.add(object);
  frameObject(object);
  // 直接テクスチャ指定があれば上書き適用（jpg / png どちらでも可）
  if (cfg.texture && cfg.texture.trim() !== "") {
    applyTextureOverride(object, cfg.texture);
  }
  overlay.classList.add("hidden");
}

const manager = new THREE.LoadingManager();
manager.onError = (url) => {
  showError(`ファイルを読み込めませんでした：<br><code>${url}</code><br><br>
    パスが正しいか、GitHub 上に同じ階層でアップロードされているか確認してください。`);
};

function loadOBJ(objPath, materials) {
  const loader = new OBJLoader(manager);
  if (materials) loader.setMaterials(materials);
  loader.load(objPath, addObject, undefined, (e) => {
    showError(`OBJ を読み込めませんでした：<br><code>${objPath}</code>`);
  });
}

// glTF / GLB loader (with Draco decompression support)
let dracoLoader = null;
function getDraco() {
  if (!dracoLoader) {
    dracoLoader = new DRACOLoader(manager);
    dracoLoader.setDecoderPath("vendor/three/addons/draco/gltf/");
  }
  return dracoLoader;
}
function loadGLTF(path) {
  const loader = new GLTFLoader(manager);
  loader.setDRACOLoader(getDraco());
  loader.load(path, (gltf) => addObject(gltf.scene), undefined, () => {
    showError(`モデルを読み込めませんでした：<br><code>${path}</code>`);
  });
}

function startLoad(objPath, mtlPath) {
  const ext = (objPath || "").toLowerCase();
  if (ext.endsWith(".glb") || ext.endsWith(".gltf")) {
    loadGLTF(objPath);
    return;
  }
  if (mtlPath && mtlPath.trim() !== "") {
    const mtlLoader = new MTLLoader(manager);
    // resolve texture paths relative to the mtl folder
    const base = mtlPath.substring(0, mtlPath.lastIndexOf("/") + 1);
    mtlLoader.setResourcePath(base);
    mtlLoader.load(mtlPath, (materials) => {
      materials.preload();
      loadOBJ(objPath, materials);
    }, undefined, () => {
      // MTL failed → load OBJ without materials
      console.warn("MTL の読み込みに失敗。マテリアル無しで表示します。");
      loadOBJ(objPath, null);
    });
  } else {
    loadOBJ(objPath, null);
  }
}

// --- Auto-detect the model file inside modelDir on GitHub Pages ---
function detectRepo() {
  const host = location.hostname;               // e.g. user.github.io
  if (!host.endsWith(".github.io")) return null; // not GitHub Pages
  const owner = host.replace(".github.io", "");
  const seg = location.pathname.split("/").filter(Boolean);
  // project page → /<repo>/... ; user page → repo is <owner>.github.io
  const repo = seg.length ? seg[0] : (owner + ".github.io");
  return { owner, repo };
}

async function resolveModel() {
  const fallback = { obj: cfg.obj, mtl: cfg.mtl };
  if (!cfg.autoDetect) return fallback;
  try {
    const rp = detectRepo();
    if (!rp) return fallback; // ローカル等 → 設定値を使う
    const api = `https://api.github.com/repos/${rp.owner}/${rp.repo}/contents/${cfg.modelDir}`;
    const res = await fetch(api, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error("GitHub API " + res.status);
    const list = await res.json();
    if (!Array.isArray(list)) throw new Error("unexpected response");
    const files = list.filter(f => f.type === "file");
    // .glb → .gltf → .obj の優先順で選ぶ
    const pick = files.find(f => /\.glb$/i.test(f.name))
              || files.find(f => /\.gltf$/i.test(f.name))
              || files.find(f => /\.obj$/i.test(f.name));
    if (!pick) throw new Error("no model (.glb/.gltf/.obj) in /" + cfg.modelDir);
    let mtl = "";
    if (/\.obj$/i.test(pick.name)) {
      const baseName = pick.name.replace(/\.obj$/i, "").toLowerCase();
      const m = files.find(f => f.name.toLowerCase() === baseName + ".mtl")
             || files.find(f => /\.mtl$/i.test(f.name));
      mtl = m ? cfg.modelDir + "/" + m.name : "";
    }
    return { obj: cfg.modelDir + "/" + pick.name, mtl };
  } catch (e) {
    console.warn("モデルの自動検出に失敗、設定値を使用します:", e.message);
    return fallback;
  }
}

resolveModel().then(({ obj, mtl }) => startLoad(obj, mtl));

// --- UI wiring ---
const bgColorInput = document.getElementById("bgColor");
const swatches = document.querySelectorAll("#bgSwatches .sw");
function setBg(hex) {
  bg.set(hex);
  bgColorInput.value = hex;
  swatches.forEach(s => s.classList.toggle("active", s.dataset.c === hex.toLowerCase()));
}
swatches.forEach(sw => sw.addEventListener("click", () => setBg(sw.dataset.c)));
bgColorInput.addEventListener("input", (e) => setBg(e.target.value));
setBg("#14161c");

const dirLight = document.getElementById("dirLight");
const dirVal = document.getElementById("dirVal");
dirLight.addEventListener("input", () => {
  dir.intensity = parseFloat(dirLight.value);
  dir2.intensity = parseFloat(dirLight.value) * 0.33;
  dirVal.textContent = parseFloat(dirLight.value).toFixed(2);
});

const ambLight = document.getElementById("ambLight");
const ambVal = document.getElementById("ambVal");
ambLight.addEventListener("input", () => {
  ambient.intensity = parseFloat(ambLight.value);
  ambVal.textContent = parseFloat(ambLight.value).toFixed(2);
});

// --- Scale bar (bottom-right, updates with zoom) ---
const scalebar = document.getElementById("scalebar");
const scaleNum = document.getElementById("scaleNum");
const scaleBarLine = document.getElementById("scaleBarLine");
let scaleVisible = true;

const scaleToggle = document.getElementById("scaleToggle");
scaleToggle.addEventListener("change", () => {
  scaleVisible = scaleToggle.checked;
  scalebar.classList.toggle("hidden", !scaleVisible);
});

function niceNumber(x) {
  const exp = Math.floor(Math.log10(x));
  const f = x / Math.pow(10, exp);
  const nf = f >= 5 ? 5 : f >= 2 ? 2 : 1;
  return nf * Math.pow(10, exp);
}
function formatNum(n) {
  if (n >= 1) return n.toLocaleString("en-US");
  // show enough decimals for small values
  return n.toPrecision(1).replace(/0+$/, "").replace(/\.$/, "");
}
const TARGET_PX = 120;
const UNIT_TO_MM = (cfg && cfg.unitToMm) || 1;      // model units → mm
const MAX_SCALE_MM = (cfg && cfg.maxScaleMm) || 100; // cap (100mm = 10cm)
function updateScaleBar() {
  if (!scaleVisible) return;
  const dist = camera.position.distanceTo(controls.target);
  const vh = renderer.domElement.clientHeight || window.innerHeight;
  const worldPerPixel = (2 * dist * Math.tan((camera.fov * Math.PI / 180) / 2)) / vh;
  if (!isFinite(worldPerPixel) || worldPerPixel <= 0) return;
  const mmPerPixel = worldPerPixel * UNIT_TO_MM;
  // pick a nice round mm value that is close to TARGET_PX wide, capped at 10cm
  let niceMm = niceNumber(mmPerPixel * TARGET_PX);
  if (niceMm > MAX_SCALE_MM) niceMm = MAX_SCALE_MM;
  const px = niceMm / mmPerPixel;
  scaleBarLine.style.width = px.toFixed(1) + "px";
  scaleNum.textContent = formatNum(niceMm);
}

document.getElementById("resetBtn").addEventListener("click", () => {
  camera.position.copy(homePos);
  controls.target.copy(homeTarget);
  controls.update();
});

// --- Resize ---
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Render loop ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateScaleBar();
  renderer.render(scene, camera);
}
animate();

// safety: if nothing loaded in 15s, hint the user
setTimeout(() => {
  if (!overlay.classList.contains("hidden") && !overlay.classList.contains("error")) {
    showError("読み込みに時間がかかっています。ネットワークとファイルパスを確認してください。");
  }
}, 15000);
</script>
</body>
</html>
